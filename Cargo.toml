[workspace]
resolver = "3"
members = ["crates/*/*", "platforms/*", "servers/*", "clients/*", "demos/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/holykernel/holykernel"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
acpi = { version = "7.0.0-pre1", default-features = false }
ahci-driver = "0.2"
amd-iommu = { version = "0.1.0", git = "https://github.com/sergeyvolkovich/iommu-rs", rev = "721606e9f6b66a550b49d07e88fa582ed036c114", default-features = false }
ax-crate-interface = "0.5"
ax-sync = "0.6"
bitflags = { version = "2.6", default-features = false }
clap = "4.5"
crab-usb = "0.12"
dma-api = "0.10"
hermit-dtb = "0.1.1"
hk-async = { version = "0.1.0", path = "crates/user/hk-async" }
hk-base = { version = "0.1.0", path = "crates/shared/hk-base" }
hk-block = { version = "0.1.0", path = "crates/user/hk-block" }
hk-block-ipc = { version = "0.1.0", path = "crates/user/hk-block-ipc" }
hk-boot = { version = "0.1.0", path = "crates/kernel/hk-boot" }
hk-cadence = { version = "0.1.0", path = "crates/shared/hk-cadence" }
hk-canvas = { version = "0.1.0", path = "crates/user/hk-canvas" }
hk-catalog = { version = "0.1.0", path = "crates/shared/hk-catalog" }
hk-checkpoint = { version = "0.1.0", path = "crates/shared/hk-checkpoint" }
hk-coroutine = { version = "0.1.0", path = "crates/user/hk-coroutine" }
hk-debug = { version = "0.1.0", path = "crates/user/hk-debug" }
hk-device = { version = "0.1.0", path = "crates/shared/hk-device" }
hk-driver-host = { version = "0.1.0", path = "crates/user/hk-driver-host" }
hk-driver-rdif = { version = "0.1.0", path = "crates/user/hk-driver-rdif" }
hk-driver-usb = { version = "0.1.0", path = "crates/user/hk-driver-usb" }
hk-driver-virtio = { version = "0.1.0", path = "crates/user/hk-driver-virtio" }
hk-drivers = { version = "0.1.0", path = "crates/kernel/hk-drivers" }
hk-font = { version = "0.1.0", path = "crates/shared/hk-font", default-features = false }
hk-framebuffer = { version = "0.1.0", path = "crates/kernel/hk-framebuffer" }
hk-fs = { version = "0.1.0", path = "crates/user/hk-fs" }
hk-fs-ext4 = { version = "0.1.0", path = "crates/user/hk-fs-ext4" }
hk-fs-holyfs = { version = "0.1.0", path = "crates/user/hk-fs-holyfs" }
hk-fs-remote = { version = "0.1.0", path = "crates/user/hk-fs-remote" }
hk-fw = { version = "0.1.0", path = "crates/shared/hk-fw" }
hk-hal = { version = "0.1.0", path = "crates/kernel/hk-hal" }
hk-handle = { version = "0.1.0", path = "crates/kernel/hk-handle" }
hk-holy-proto = { version = "0.1.0", path = "crates/user/hk-holy-proto" }
hk-holy-service = { version = "0.1.0", path = "crates/user/hk-holy-service" }
hk-image = { version = "0.1.0", path = "crates/shared/hk-image" }
hk-ipc = { version = "0.1.0", path = "crates/kernel/hk-ipc" }
hk-kernel = { version = "0.1.0", path = "crates/kernel/hk-kernel" }
hk-kernel-shell = { version = "0.1.0", path = "crates/kernel/hk-kernel-shell" }
hk-mem = { version = "0.1.0", path = "crates/kernel/hk-mem" }
hk-mmio = { version = "0.1.0", path = "crates/shared/hk-mmio" }
hk-net = { version = "0.1.0", path = "crates/user/hk-net" }
hk-paging = { version = "0.1.0", path = "crates/kernel/hk-paging" }
hk-platform-hosted = { version = "0.1.0", path = "crates/kernel/hk-platform-hosted" }
hk-platform-x86_64 = { version = "0.1.0", path = "crates/kernel/hk-platform-x86_64" }
hk-proto = { version = "0.1.0", path = "crates/user/hk-proto" }
hk-proto-client = { version = "0.1.0", path = "crates/user/hk-proto-client" }
hk-root-server = { version = "0.1.0", path = "crates/kernel/hk-root-server" }
hk-runtime = { version = "0.1.0", path = "crates/kernel/hk-runtime" }
hk-server-api = { version = "0.1.0", path = "crates/user/hk-server-api" }
hk-server-build = { version = "0.1.0", path = "crates/user/hk-server-build" }
hk-shell = { version = "0.1.0", path = "crates/shared/hk-shell" }
hk-sim = { version = "0.1.0", path = "crates/kernel/hk-sim" }
hk-smp = { version = "0.1.0", path = "crates/kernel/hk-smp" }
hk-status = { version = "0.1.0", path = "crates/shared/hk-status" }
hk-symbols = { version = "0.1.0", path = "crates/shared/hk-symbols" }
hk-sync = { version = "0.1.0", path = "crates/user/hk-sync" }
hk-syscall = { version = "0.1.0", path = "crates/shared/hk-syscall" }
hk-syscall-client = { version = "0.1.0", path = "crates/user/hk-syscall-client" }
hk-thread = { version = "0.1.0", path = "crates/user/hk-thread" }
hk-vfs = { version = "0.1.0", path = "crates/user/hk-vfs" }
hk-worker = { version = "0.1.0", path = "crates/user/hk-worker" }
intel-iommu = { version = "0.1.0", git = "https://github.com/sergeyvolkovich/iommu-rs", rev = "721606e9f6b66a550b49d07e88fa582ed036c114", default-features = false }
libm = "0.2"
linked_list_allocator = "0.10"
log = { version = "0.4", default-features = false }
lovyangfx-fonts = { version = "0.2", default-features = false }
mmio-api = "0.3"
nvme-driver = "0.8"
page_table_entry = "0.6.2"
rdif-block = "0.13"
rsext4 = { version = "0.9.2", default-features = false }
smoltcp = { version = "0.14", default-features = false }
spin = "0.9"
toml = "0.8"
ttf-parser = { version = "0.25", default-features = false }
virtio-drivers = { version = "0.13", default-features = false }
volatile-register = "0.2.2"
x86_64 = { version = "0.15.4", default-features = false }
xmas-elf = "0.10"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"

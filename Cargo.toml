[workspace]
resolver = "3"
members = ["crates/*/*", "platforms/*", "servers/*", "clients/*", "demos/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/holykernel/holykernel"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"

[package]
name = "hk-hosted"
description = "HolyKernel Hosted 模拟器启动入口"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-hosted"
path = "src/main.rs"

[dependencies]
hk-cadence = { version = "0.1.0", path = "../../crates/shared/hk-cadence" }
clap = { version = "4.5", features = ["derive"] }
hk-hal = { version = "0.1.0", path = "../../crates/kernel/hk-hal" }
hk-handle = { version = "0.1.0", path = "../../crates/kernel/hk-handle" }
hk-ipc = { version = "0.1.0", path = "../../crates/kernel/hk-ipc" }
hk-kernel = { version = "0.1.0", path = "../../crates/kernel/hk-kernel" }
hk-mem = { version = "0.1.0", path = "../../crates/kernel/hk-mem" }
hk-platform-hosted = { version = "0.1.0", path = "../../crates/kernel/hk-platform-hosted" }
hk-root-server = { version = "0.1.0", path = "../../crates/kernel/hk-root-server" }
hk-sim = { version = "0.1.0", path = "../../crates/kernel/hk-sim" }
hk-test = { version = "0.1.0", path = "../../crates/kernel/hk-test" }

[lints]
workspace = true

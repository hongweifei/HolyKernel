[package]
name = "hk-font"
description = "HolyKernel 字体：TrueType 栅格化、等宽位图与 8×16 回退"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["scalable"]
scalable = ["dep:ttf-parser"]

[dependencies]
libm.workspace = true
lovyangfx-fonts = { workspace = true, features = ["efont-cn-16"] }
spin.workspace = true
ttf-parser = { workspace = true, features = ["no-std-float"], optional = true }

[lints]
workspace = true

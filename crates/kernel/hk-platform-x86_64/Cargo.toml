[package]
name = "hk-platform-x86_64"
description = "HolyKernel x86_64 平台：串口控制台与硬件访问"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hk-device = { version = "0.1.0", path = "../../shared/hk-device" }
hk-base = { version = "0.1.0", path = "../../shared/hk-base" }
hk-checkpoint = { version = "0.1.0", path = "../../shared/hk-checkpoint" }
hk-drivers = { version = "0.1.0", path = "../hk-drivers" }
hk-framebuffer = { version = "0.1.0", path = "../hk-framebuffer" }
hk-fw = { version = "0.1.0", path = "../../shared/hk-fw" }
hk-hal = { version = "0.1.0", path = "../hk-hal" }
hk-mem = { version = "0.1.0", path = "../hk-mem" }
hk-paging = { version = "0.1.0", path = "../hk-paging" }
hk-mmio = { version = "0.1.0", path = "../../shared/hk-mmio" }
hk-smp = { version = "0.1.0", path = "../hk-smp" }
hk-syscall = { version = "0.1.0", path = "../../shared/hk-syscall" }
hk-test = { version = "0.1.0", path = "../hk-test" }
amd-iommu = { git = "https://github.com/sergeyvolkovich/iommu-rs", rev = "721606e9f6b66a550b49d07e88fa582ed036c114", default-features = false }
intel-iommu = { git = "https://github.com/sergeyvolkovich/iommu-rs", rev = "721606e9f6b66a550b49d07e88fa582ed036c114", default-features = false }
page_table_entry = "0.6.2"
spin = "0.9"
x86_64 = { version = "0.15.4", default-features = false, features = ["instructions"] }


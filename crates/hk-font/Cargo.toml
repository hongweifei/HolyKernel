[package]
name = "hk-font"
description = "HolyKernel 字体：TrueType 栅格化、等宽位图与 8×16 回退"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["scalable"]
scalable = ["dep:ttf-parser"]

[dependencies]
hk-canvas = { version = "0.1.0", path = "../hk-canvas" }
libm = "0.2"
lovyangfx-fonts = { version = "0.2", default-features = false, features = ["efont-cn-16"] }
spin = "0.9"
ttf-parser = { version = "0.25", default-features = false, features = ["no-std-float"], optional = true }

[lints]
workspace = true

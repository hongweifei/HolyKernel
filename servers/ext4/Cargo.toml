hk-proto = { version = "0.1.0", path = "../../crates/user/hk-proto" }
hk-server-api = { version = "0.1.0", path = "../../crates/user/hk-server-api" }
hk-vfs = { version = "0.1.0", path = "../../crates/user/hk-vfs" }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/user/hk-server-build" }

[lints]
workspace = true

[package]
name = "hk-server-workbench"
description = "HolyKernel 原生工作台：文档浏览、编辑、构建、运行与调试"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-workbench"
path = "src/main.rs"

[dependencies]
hk-canvas = { version = "0.1.0", path = "../../crates/hk-canvas" }
hk-font = { version = "0.1.0", path = "../../crates/hk-font" }
hk-debug = { version = "0.1.0", path = "../../crates/hk-debug" }
hk-proto = { version = "0.1.0", path = "../../crates/hk-proto" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

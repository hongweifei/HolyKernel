[package]
name = "hk-server-vfs"
description = "HolyKernel VFS Server：tmpfs 根与文件操作协议"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-vfs"
path = "src/main.rs"

[dependencies]
hk-block = { version = "0.1.0", path = "../../crates/hk-block", features = ["ipc"] }
hk-fs-ext4 = { version = "0.1.0", path = "../../crates/hk-fs-ext4" }
hk-fs-holyfs = { version = "0.1.0", path = "../../crates/hk-fs-holyfs" }
hk-fs-holyfs-vfs = { version = "0.1.0", path = "../../crates/hk-fs-holyfs-vfs" }
hk-hal = { version = "0.1.0", path = "../../crates/hk-hal" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }
hk-vfs = { version = "0.1.0", path = "../../crates/hk-vfs" }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

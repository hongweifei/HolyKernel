hk-proto-client = { version = "0.1.0", path = "../../crates/user/hk-proto-client" }
hk-server-api = { version = "0.1.0", path = "../../crates/user/hk-server-api" }
hk-vfs = { version = "0.1.0", path = "../../crates/user/hk-vfs" }

[build-dependencies]

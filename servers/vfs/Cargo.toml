[package]
name = "hk-server-vfs"
description = "HolyKernel VFS Server：DocId、集合、修订与文档令牌命名空间"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-vfs"
path = "src/main.rs"

[dependencies]
hk-base = { version = "0.1.0", path = "../../crates/hk-base" }
hk-block = { version = "0.1.0", path = "../../crates/hk-block", features = ["ipc"] }
hk-fs = { version = "0.1.0", path = "../../crates/hk-fs" }
hk-fs-ext4 = { version = "0.1.0", path = "../../crates/hk-fs-ext4" }
hk-proto = { version = "0.1.0", path = "../../crates/hk-proto" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }
hk-vfs = { version = "0.1.0", path = "../../crates/hk-vfs" }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

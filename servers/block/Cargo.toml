[package]
name = "hk-server-block"
description = "HolyKernel Block Server：RAM disk 后端与块协议"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-block"
path = "src/main.rs"

[dependencies]
hk-block = { version = "0.1.0", path = "../../crates/hk-block" }
hk-drivers = { version = "0.1.0", path = "../../crates/hk-drivers" }
hk-hal = { version = "0.1.0", path = "../../crates/hk-hal" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }
spin = "0.9"
virtio-drivers = { version = "0.13", default-features = false }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

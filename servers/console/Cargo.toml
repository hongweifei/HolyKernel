[package]
name = "hk-server-console"
description = "HolyKernel 控制台服务：行编辑与输入分发"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-console"
path = "src/main.rs"

[dependencies]
hk-canvas = { version = "0.1.0", path = "../../crates/hk-canvas" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }
lovyangfx-fonts = { version = "0.2", default-features = false, features = ["efont-cn-16"] }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

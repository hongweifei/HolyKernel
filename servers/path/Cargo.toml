[package]
name = "hk-server-path"
description = "HolyKernel Path Server：路径、fd 与 POSIX 风格文件操作"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-path"
path = "src/main.rs"

[dependencies]
hk-block = { version = "0.1.0", path = "../../crates/hk-block", features = ["ipc"] }
hk-fs = { version = "0.1.0", path = "../../crates/hk-fs" }
hk-fs-ext4 = { version = "0.1.0", path = "../../crates/hk-fs-ext4" }
hk-hal = { version = "0.1.0", path = "../../crates/hk-hal" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }
hk-vfs = { version = "0.1.0", path = "../../crates/hk-vfs" }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

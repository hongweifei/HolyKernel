[package]
name = "hk-server-holyfs"
description = "HolyKernel HolyFS Server：独立 Holy 卷与原生文档协议"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hk-server-holyfs"
path = "src/main.rs"

[dependencies]
hk-async = { version = "0.1.0", path = "../../crates/hk-async" }
hk-block = { version = "0.1.0", path = "../../crates/hk-block", features = ["ipc"] }
hk-fs = { version = "0.1.0", path = "../../crates/hk-fs" }
hk-fs-holyfs = { version = "0.1.0", path = "../../crates/hk-fs-holyfs" }
hk-proto = { version = "0.1.0", path = "../../crates/hk-proto" }
hk-server-api = { version = "0.1.0", path = "../../crates/hk-server-api" }
hk-worker = { version = "0.1.0", path = "../../crates/hk-worker" }

[build-dependencies]
hk-server-build = { version = "0.1.0", path = "../../crates/hk-server-build" }

[lints]
workspace = true

[package]
name = "xtask"
description = "HolyKernel 构建、运行、测试与校验任务"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hk-block = { version = "0.1.0", path = "../crates/hk-block" }
hk-fs-ext4 = { version = "0.1.0", path = "../crates/hk-fs-ext4" }
hk-hal = { version = "0.1.0", path = "../crates/hk-hal" }
hk-vfs = { version = "0.1.0", path = "../crates/hk-vfs" }

[lints]
workspace = true
